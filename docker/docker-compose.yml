  lfm2.5-1.2b-decider:
    <<: *vllm
    profiles: [models]
    command: ["--config", "/configs/lfm2.5-1.2b-decider.yaml"]
    ports: ["8021:8021"]

  llama3.1-8b:
    <<: *vllm
    profiles: [models]
    command: ["--config", "/configs/llama3.1-8b.yaml"]
    ports: ["8003:8003"]

  mistral-7b:
    <<: *vllm
    profiles: [models]
    command: ["--config", "/configs/mistral-7b.yaml"]
    ports: ["8004:8004"]

  phi4-mini:
    <<: *vllm
    profiles: [models]
    command: ["--config", "/configs/phi4-mini.yaml"]
    ports: ["8005:8005"]

  qwen2.5-1.5b:
