# Docker flavour (Linux + NVIDIA GPU + NVIDIA Container Toolkit).
# Each model is its own service; nothing starts unless you name it:
#   cp .env.example .env            # then fill in VLLM_API_KEY (and HF_TOKEN for gated models)
#   docker compose up -d qwen3-8b   # start one model
#   docker compose logs -f qwen3-8b
#   docker compose down
# Settings come from ../configs/nvidia/<service>.yaml (same files as the Linux and Kubernetes flavours).

x-vllm: &vllm
  image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.32.0}
  env_file: .env
  ipc: host                       # vLLM needs large shared memory between its processes
  volumes:
    - ../configs/nvidia:/configs:ro
    - hf-cache:/root/.cache/huggingface   # model weights survive container restarts
  restart: unless-stopped
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1              # one GPU per model; on a single-GPU machine run one model at a time
            capabilities: [gpu]

services:
  bge-m3:
    <<: *vllm
    profiles: [models]
    command: ["--config", "/configs/bge-m3.yaml"]
    ports: ["8031:8031"]

  deepseek-r1-qwen-7b:
    <<: *vllm
    profiles: [models]
    command: ["--config", "/configs/deepseek-r1-qwen-7b.yaml"]
    ports: ["8010:8010"]

  gemma3-12b:
    <<: *vllm
    profiles: [models]
    command: ["--config", "/configs/gemma3-12b.yaml"]
    ports: ["8006:8006"]

  gpt-oss-20b:
