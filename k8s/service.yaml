# Internal address for the gateway: http://vllm-qwen3-8b.<namespace>.svc.cluster.local:8002/v1
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen3-8b
  labels: {app: vllm, model: qwen3-8b}
spec:
  type: ClusterIP
  selector: {app: vllm, model: qwen3-8b}
  ports:
    - name: http
      port: 8002
      targetPort: http
