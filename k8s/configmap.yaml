# Model config for this deployment. Keep in sync with configs/nvidia/qwen3-8b.yaml
# (or regenerate: kubectl create configmap vllm-qwen3-8b-config --from-file=model.yaml=configs/nvidia/qwen3-8b.yaml --dry-run=client -o yaml)
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-qwen3-8b-config
  labels: {app: vllm, model: qwen3-8b}
data:
  model.yaml: |
    # Qwen3 8B, hybrid thinking model
    # type: chat
    # Start: ./serve.sh configs/nvidia/qwen3-8b.yaml
    # API key: set VLLM_API_KEY in the environment (never commit it)
    
    model: Qwen/Qwen3-8B
    served-model-name: Qwen/Qwen3-8B     # the id clients and the gateway use
    host: 0.0.0.0
    port: 8002
    max-model-len: 8192
    gpu-memory-utilization: 0.9
    enable-auto-tool-choice: true
    tool-call-parser: hermes
    reasoning-parser: qwen3       # thinking goes to a separate 'reasoning' field
