# Template only - do not commit real values. Create the real secret with:
#   kubectl create secret generic vllm-secrets --from-literal=api-key=<key> --from-literal=hf-token=<token>
apiVersion: v1
kind: Secret
metadata:
  name: vllm-secrets
type: Opaque
stringData:
  api-key: change-me        # clients and the gateway send this as the Bearer token
  hf-token: ""              # only needed for gated models (Llama, Gemma)
