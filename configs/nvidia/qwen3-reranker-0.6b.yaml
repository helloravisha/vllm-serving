# Qwen3 reranker, /rerank
# type: rerank
# Start: ./serve.sh configs/nvidia/qwen3-reranker-0.6b.yaml
# API key: set VLLM_API_KEY in the environment (never commit it)

model: Qwen/Qwen3-Reranker-0.6B
served-model-name: Qwen/Qwen3-Reranker-0.6B     # the id clients and the gateway use
host: 0.0.0.0
port: 8032
max-model-len: 8192
gpu-memory-utilization: 0.3
runner: pooling
convert: classify
hf-overrides: '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'
