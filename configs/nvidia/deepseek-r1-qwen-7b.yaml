# DeepSeek R1 distilled into Qwen 7B, reasoning model
# type: reasoning
# Start: ./serve.sh configs/nvidia/deepseek-r1-qwen-7b.yaml
# API key: set VLLM_API_KEY in the environment (never commit it)

model: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
served-model-name: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B     # the id clients and the gateway use
host: 0.0.0.0
port: 8010
max-model-len: 8192
gpu-memory-utilization: 0.9
reasoning-parser: deepseek_r1   # thinking goes to a separate 'reasoning' field
