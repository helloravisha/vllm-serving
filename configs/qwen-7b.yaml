# Qwen2.5 7B Instruct on CPU. Speed on M4 Pro: ~4-5 tok/s (est.)
# Start: ./serve.sh configs/qwen-7b.yaml   (any vllm serve flag can be appended to override)
model: Qwen/Qwen2.5-7B-Instruct
port: 8000
api-key: dummy                   # gateway requires a non-empty key
dtype: float16                   # macOS CPU supports float16/float32 only
max-model-len: 8192
kv-cache-memory-bytes: 12884901888   # 12 GiB of RAM for the KV cache

# Tool / function calling (Qwen2.5 uses the hermes format)
enable-auto-tool-choice: true
tool-call-parser: hermes
