# Qwen2.5 1.5B Instruct on CPU. Speed on M4 Pro: ~23 tok/s (measured)
# Start: ./serve.sh configs/qwen-1.5b.yaml   (any vllm serve flag can be appended to override)
model: Qwen/Qwen2.5-1.5B-Instruct
port: 8000
api-key: dummy                   # gateway requires a non-empty key
dtype: float16                   # macOS CPU supports float16/float32 only
max-model-len: 4096
kv-cache-memory-bytes: 8589934592   # 8 GiB of RAM for the KV cache

# Tool / function calling (Qwen2.5 uses the hermes format)
enable-auto-tool-choice: true
tool-call-parser: hermes
