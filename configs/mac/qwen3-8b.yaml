# Qwen3 8B, hybrid thinking model
# type: chat
# Start: ./serve.sh configs/mac/qwen3-8b.yaml

model: mlx-community/Qwen3-8B-4bit
served-model-name: Qwen/Qwen3-8B     # the id clients and the gateway use
host: 127.0.0.1
port: 8002
api-key: dummy
max-model-len: 8192
gpu-memory-utilization: 0.35   # share of unified memory; Mac RAM is shared with your apps
enable-auto-tool-choice: true
tool-call-parser: hermes
reasoning-parser: qwen3       # thinking goes to a separate 'reasoning' field
